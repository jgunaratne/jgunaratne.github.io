name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check .

      - name: Check local links and assets resolve
        run: python3 scripts/check-links.py

      - name: Check every image has alt text
        run: |
          if grep -rno '<img [^>]*>' --include='*.html' --exclude-dir=node_modules . | grep -v 'alt='; then
            echo "::error::images above are missing alt text"
            exit 1
          fi
          echo "All images have alt text."

      - name: Check videos are not eagerly loaded
        run: |
          if grep -rno '<video[^>]*autoplay[^>]*>' --include='*.html' --exclude-dir=node_modules .; then
            echo "::error::videos must not use autoplay; jg-media.js plays them in view"
            exit 1
          fi
          if grep -rno '<video[^>]*>' --include='*.html' --exclude-dir=node_modules . | grep -v 'preload='; then
            echo "::error::videos above are missing preload"
            exit 1
          fi
          echo "Video loading attributes OK."

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
